# Branche P6 — Propriété exclusive du DOM.
#
# Migration depuis docs/reorganisation-sept-2026/arbre-invariants-precision.md.
# Champs : voir P8.yaml pour la légende complète.
# ⚠️ Aucun énoncé (E) : aucun invariant existant ne formule le principe. I38 en est le plus
# proche mais mêle la règle (exclusivité) et une décision (niveaux N1/N2/N3). À écrire.

- id: I38
  nature: D
  parents: [P6]
  enonce: "Les niveaux d'altération DOM contraignent chaque composant : Foundation N1 sur `<html>`/`<body>`, View N1 à N3 selon le template, Composer aucune écriture."
  pourquoi: >
    Rendre explicite jusqu'où chaque rôle peut muter le DOM, pour que deux composants ne
    revendiquent jamais le même nœud à des degrés différents (ADR-16).
  # N1 (getUI) et « Composer sans écriture » (I35) livrés ; N2/N3 (templates) non livrés, strate 1c.
  mode: type
  etat: partiel

- id: I33
  nature: D
  parents: [P6]
  enonce: La Foundation est unique par application ; elle seule peut altérer `<html>` et `<body>` (N1).
  pourquoi: >
    Sans propriétaire unique de `<html>`/`<body>`, deux Views indépendantes pourraient s'y disputer
    une classe ou un attribut global (ADR-20).
  mode: boot
  etat: partiel

- id: I34
  nature: C
  parents: [I33]
  enonce: Le `rootElement` d'une View est un descendant strict de `<body>`, jamais `<body>` lui-même.
  mode: boot
  etat: livre

- id: I40
  nature: C
  parents: [P6]
  enonce: Le scope DOM d'une View est son `rootElement` moins les sous-arbres des slots qu'elle déclare.
  mode: boot
  etat: partiel

- id: I41
  nature: C
  parents: [P6]
  enonce: Chaque clé `@ui` a une source de mutation unique — son template ou `getUI()`, jamais les deux.
  mode: type
  etat: cible

- id: I43
  nature: C
  parents: [P6]
  enonce: Les clés `uiEvents` d'un Behavior sont disjointes de celles de sa View hôte.
  mode: boot
  etat: cible

- id: I39
  nature: D
  parents: [P6]
  enonce: La View accède au DOM exclusivement via `getUI(key)` ; aucun `querySelector` ni accès DOM brut ne lui est exposé.
  pourquoi: >
    Un point d'accès unique empêche la View d'accumuler des sélecteurs ad hoc qui échapperaient au
    scope calculé (I40) et à la source de mutation unique (I41) (ADR-16).
  mode: type
  etat: partiel

- id: I32
  nature: D
  parents: [P6]
  enonce: La View peut altérer son `rootElement` en N1, mais ne le détruit ni ne le remplace jamais.
  pourquoi: >
    Le `rootElement` appartient au cycle de vie géré par le Composer : si la View pouvait le détruire
    ou le remplacer, elle violerait à la fois P6 et P7 (ADR-22).
  # Aucun mécanisme : `protected get el()` expose le nœud brut, la View peut le retirer du DOM.
  mode: revue
  etat: convention

- id: I31
  nature: D
  parents: [P6]
  enonce: Le `rootElement` d'une View est un sélecteur CSS fourni exclusivement par le Composer.
  pourquoi: >
    Le Composer reste seul décideur du placement ; la View ne fait qu'exploiter le résultat, sans
    paramètre de montage propre (ADR-19).
  mode: boot
  etat: partiel

- id: I35
  nature: D
  parents: [P6]
  enonce: Un Composer n'écrit jamais dans le DOM ; il ne lit son scope que pour résoudre le `rootElement` d'une View enfant.
  pourquoi: >
    Un Composer qui écrirait dans le DOM cumulerait décider et rendre : I35 laisse le rendu à la
    seule View (P5) et fait du Composer un décideur pur (ADR-18).
  mode: revue
  etat: livre

- id: I44
  nature: D
  parents: [P6]
  enonce: Un Behavior n'a aucun accès aux propriétés de sa View hôte (`this.view`, `el`, `getUI`).
  pourquoi: >
    Sans cette barrière, un Behavior pourrait contourner ses propres clés déclarées et muter les
    nœuds de la View, rendant la source de mutation unique (I41) invérifiable (ADR-21).
  # Aucun package Behavior n'existe (strate 2b).
  mode: type
  etat: cible

- id: I45
  nature: D
  parents: [P6]
  enonce: Un Behavior altère en N1 et N2 uniquement ses propres clés ui déclarées, jamais en N3.
  pourquoi: >
    Le Behavior n'a pas de `rootElement` : il enrichit des nœuds existants sans pouvoir se substituer
    à la View qui les possède (ADR-21).
  # Aucun package Behavior n'existe (strate 2b).
  mode: type
  etat: cible
