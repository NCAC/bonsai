# Branche P3 — Sémantique des trois voies.
#
# Migration depuis docs/reorganisation-sept-2026/arbre-invariants-precision.md.
# Champs : voir P8.yaml pour la légende complète.

- id: I10
  nature: E
  parents: [P3]
  roles: [Channel, Feature]
  enonce: Un Command a un seul handler — la Feature propriétaire du Channel.
  mode: boot
  etat: livre

- id: I11
  nature: E
  parents: [P3]
  roles: [Channel]
  enonce: Un Event peut avoir N abonnés.
  mode: run
  etat: livre

- id: I27
  nature: E
  parents: [P3]
  roles: [Channel, Feature]
  enonce: Un Command peut être refusé par la Feature qui le traite ; un Event est un fait accompli qui ne peut être refusé.
  # Les tests prouvent seulement : Command sans handler → throw, Event sans abonné → ignoré.
  # Aucun mécanisme de refus d'un Command par son handler n'est testé.
  mode: run
  etat: partiel

# I12 et I26 fusionnés ici : même règle vue sous trois angles (émettre sur son Channel,
# ne pas émettre sur un Channel étranger, seule la Feature propriétaire appelle emit()).
# L'autre moitié d'I26 (« un Event est diffusé à N abonnés ») relève d'I11 : les tests qui
# citaient I26 pour la diffusion 1:N citent désormais I11.
- id: I1
  nature: C
  parents: [P3]
  roles: [Feature]
  alias: [I12, I26]
  enonce: Une Feature n'émet (`emit`) que sur son propre Channel — aucune émission cross-domain, et seule la Feature propriétaire utilise `emit()`.
  mode: type
  etat: livre

- id: I25
  nature: C
  parents: [P3, P5]
  roles: ["*"]
  enonce: Une Command vise un Channel déclaré dans les limites des parties ; une Feature n'en adresse pas à une autre Feature, mais peut en adresser à un adaptateur du domaine. Le domaine n'adresse rien à un adaptateur de l'interface et n'en reçoit rien. Les Commands de l'interface restent soumises à I13 ; le Behavior agit au nom de sa View, et le Composer n'adresse aucune Command.
  # A4.b, D17/D18, §16.7/§16.8 ; généralisation au-delà des seules View/Behavior.
  # V0.9.4 : type → run pour les contrôles d'auteur, cible et partie ; état partiel conservé.
  # Livré : trigger typé de View, absence de trigger sur Feature/Composer/Foundation.
  # Non livré : Commands de Feature vers adaptateur domaine, rôles adaptateurs, garde D18 et imputation Behavior.
  # Le test historique refusant tout trigger Feature ne prouve pas la capacité désormais autorisée.
  mode: run
  etat: partiel

- id: I4
  nature: C
  parents: [P3, P2]
  roles: [View, Behavior]
  enonce: Une View ou un Behavior peut `trigger`, `listen` et `request` uniquement sur les Channels déclarés — jamais `emit()`.
  # Livré pour la View (capabilities.types, I77) ; le Behavior n'existe pas encore (strate 2b).
  mode: type
  etat: partiel

- id: I13
  nature: C
  parents: [P3, P5]
  roles: ["*"]
  enonce: Un composant de l'interface n'adresse une Command que pendant une réaction à un fait admis d'indépendance établie ou une continuation corrélée déjà autorisée à commander, sous réserve des interdictions de son rôle. Event, relais local d'Event, résultat d'effet corrélé à un Event et observation d'antécédent inconnu n'accordent aucune permission. Une Query préalable conserve la permission de son auteur sans l'accorder au traitement consulté, toujours en lecture seule ; sa réponse n'est pas un déclencheur autonome.
  # D18, A4.a/A4.d, C.4, §9.11 ; transversal à toute l'interface, adaptateurs compris.
  # V0.9.4 : revue/convention → run/cible ; permission dynamique, pas simple convention de handler.
  # Non livré : View.trigger() ne contrôle aucun contexte ; un handler Event peut encore l'appeler.
  # Les restrictions propres au rôle restent cumulatives : Composer ne commande jamais (I35).
  mode: run
  etat: cible

- id: I3
  nature: C
  parents: [P3]
  roles: [Feature]
  enonce: Une Feature ne répond (`reply`) que sur son propre Channel.
  # Les repliers `on<Name>Request` sont enregistrés sur le Channel propre au bootstrap.
  mode: boot
  etat: livre

- id: I17
  nature: C
  parents: [P3, P2]
  roles: [Feature]
  enonce: Une Feature ne `request` que sur les Channels déclarés en `queries`, en lecture seule — sans mutation ni side-effect.
  # `Feature.request()` accepte tout token typé, sans contrôle contre `queries` (même écart que I14).
  mode: type
  etat: partiel

- id: I29
  nature: C
  parents: [P3]
  roles: [Channel]
  enonce: Une Query rend synchroniquement une valeur du type de résultat déclaré, sans Promise ; ni l'absence de répondant ni une erreur technique ne sont converties en null. Une valeur null n'est admise que si le contrat métier la prévoit.
  pourquoi: >
    A3.g, G5 et G7 de la théorie V0.9.4 imposent une consultation synchrone en lecture seule,
    sans réponse de substitution en cas d'échec. La consultation porte sur des ressources internes
    accessibles, non sur un chargement extérieur ; la disponibilité et l'inactivité de la cible
    restent obligatoires (C.1). Le contrat T | null de l'ADR-02 est historique et doit être remplacé.
  # V0.9.4, 2026-10-30 : livre → partiel ; appel direct livré, contrat complet non réalisé.
  # Channel.request() retourne encore null sans répondant et après exception ; une Promise est acceptée.
  # Les citations historiques d'I29 testent l'ancien contrat, pas la conformité du présent énoncé.
  mode: run
  etat: partiel

- id: I64
  nature: C
  parents: [I29]
  roles: [Feature]
  enonce: Aucun I/O (`fetch`, `Promise`, `setTimeout`, `async/await`) dans un replier.
  mode: revue
  etat: convention

- id: I55
  nature: C
  parents: [I29]
  roles: [Channel]
  enonce: L'erreur technique d'une Query se propage à son auteur et entraîne l'échec de l'unité modifiante ou d'initialisation englobante selon G7 ; aucune réponse de substitution ni capture applicative ne peut transformer cet échec en validation réussie.
  pourquoi: >
    G7 et §2.5 de la théorie V0.9.4 interdisent de valider un traitement sur une consultation
    techniquement échouée. Le rollback concerne toutes les opérations internes de l'unité,
    y compris sa structure et ses messages différés, pas l'hôte ni un traitement déjà validé.
    Le confinement par null des ADR-02/ADR-05 est incompatible avec cette obligation.
  # V0.9.4, 2026-10-30 : règle historique inversée ; livre → cible.
  # Channel.request() absorbe encore l'exception ; aucune unité de rollback englobante n'est livrée.
  # Les anciens tests citant I55 prouvent le comportement désormais interdit, pas cette cible.
  mode: run
  etat: cible

- id: I65
  nature: C
  parents: [I55, I102]
  roles: [Channel]
  enonce: Toute erreur technique de Query est signalée avec son contexte causal, hors réponse et transport applicatif ; ce signalement ne remplace ni n'empêche la propagation et l'échec de l'unité exigés par I55.
  pourquoi: >
    G7 exige le signalement de l'erreur avec son contexte causal, sans réponse de substitution.
    L'observabilité ne doit donc ni blanchir une consultation échouée ni devenir un Event
    contournant les règles de transport. Un ErrorReporter injectable reste un choix de réalisation,
    non une exigence de la théorie ; le reporting avant retour de null de l'ADR-03 est abandonné.
  # V0.9.4, 2026-10-30 : partiel → cible ; console.error existe, mais il accompagne encore null.
  # Le signalement causal obligatoire n'est pas livré ; sa réalisation ne doit pas intercepter l'échec I55.
  mode: run
  etat: cible
