# I24 fusionné ici : même garantie (unicité/format des clés, type+boot), aucune
# distinction retenue. Alias conservé pour ne pas casser une citation existante.
- id: I21
  nature: D
  parents: [P8]
  alias: [I24]
  enonce: Toute Feature est enregistrée dans le manifest sous une clé `camelCase` sans chiffre.
  pourquoi: >
    Le namespace est réemployé tel quel à trois endroits : clé du manifest (identifiant TS),
    préfixe des messages (`"cart:addItem"`) et nom des handlers découverts par convention
    (`onCartItemAddedEvent`). Le `camelCase` plat est le seul format valide et lisible dans les
    trois : `kebab-case`, `snake_case` ou séparateurs `/` `.` produiraient des noms de méthode
    invalides ou ambigus (ADR-08), et la minuscule initiale fait de la majuscule la frontière du
    namespace dans le nom du handler. Les chiffres sont exclus parce que ces noms appartiennent
    au vocabulaire du domaine : un namespace nomme un domaine, comme les intentions, Events et
    Requests qu'il préfixe nomment des actions, des faits et des questions — des noms et des
    verbes, où un chiffre n'a pas de sens métier.
  # Argument des chiffres formulé par le mainteneur le 30/09 : absent des sources (ADR-08,
  # ex-ADR-0039, D5). Élargissable sans casse via un variant `CamelCaseAlnum<S>`
  # (cf. packages/types/src/string.d.ts).
  mode: type+boot
  etat: livre

- id: I71
  nature: D
  parents: [P8]
  enonce: "Les namespaces `local` et `router` sont réservés (`RESERVED_NAMESPACES`)."
  pourquoi: >
    Chaque réservation a sa raison propre (I57 pour `local`, I28 pour `router`) ; I71 en fixe la
    forme : une seule constante du framework, dont dérivent le type du manifest et le filet
    runtime — une liste, deux vérifications, aucune dérive entre elles. Elle n'est pas
    configurable : un nom réservé est une garantie du framework, pas une politique de
    l'application, qui ne peut donc pas libérer un nom dont le framework dépend. Réserver avant
    de livrer (aucun Router n'existe encore) évite qu'une application prenne le nom et casse le
    jour où la Feature du framework arrive.
  # Toute nouvelle réservation (ex. `ContributionRegistry`, ROADMAP) s'ajoute à la constante ;
  # c'est un breaking change pour une application qui utiliserait déjà ce nom.
  mode: type+boot
  etat: livre

