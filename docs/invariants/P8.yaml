# Branche P8 — Identité par le manifest (pilote).
#
# Champs :
#   id        identifiant stable (I<n>), conservé pendant la transition
#   nature    E énoncé · C conséquence · D décision · V vérification
#   parents   principe(s) ou ligne(s) parente(s) ; le premier est le parent principal
#   enonce    la règle, en une phrase
#   pourquoi  obligatoire pour une décision (D) : remplace l'ADR
#   mode      type · boot · type+boot · run · revue
#   etat      livre · partiel · cible · convention
#   preuves   facultatif : les citations dans les tests sont détectées automatiquement

