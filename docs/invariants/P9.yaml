# Branche P9 — Garantie au plus tôt (méta-principe).
#
# Migration depuis docs/reorganisation-sept-2026/arbre-invariants-precision.md.
# Champs : voir P8.yaml pour la légende complète.
# P9 porte sur la manière de garantir P1–P8 : la plupart des lignes ont un second parent.
#
# Arbitrage des lignes en mode `run` (30/09/2026, validé par le mainteneur) — trois catégories :
#   - garde dynamique (violation détectable seulement avec des données d'exécution) :
#     I8, I9, I98, I65 → légitimes, régies par I102 (échec explicite dès la première violation) ;
#   - sémantique d'exécution (comportement du framework, pas une garde contre le code applicatif) :
#     I11, I27, I29, I54, I55, I97 → hors du champ de P9, prouvées par les tests ;
#   - règle structurelle vérifiée trop tard : I20 → écart à P9, à remonter au compile-time.
#   I37 était mal qualifié (garanti par construction) : requalifié en mode `type`.

- id: I66
  nature: E
  parents: [P9]
  enonce: Le bootstrap est la frontière de confiance — après `app.start()` les garanties sont vérifiées, avant, aucun `trigger`/`emit`/`request` n'est accepté.
  mode: boot
  etat: cible

- id: I102
  nature: D
  parents: [P9]
  enonce: "Une règle qui ne peut être vérifiée qu'à l'exécution l'est par une garde fail-fast : erreur explicite dès la première violation, avec son contexte, jamais de dégradation silencieuse."
  pourquoi: >
    À l'exécution, on ne peut plus empêcher la violation, seulement la détecter : échouer tout de
    suite, avec le contexte (intent, correlationId, profondeur), réduit au minimum la distance entre
    la faute et son diagnostic. Une dégradation silencieuse repousserait le symptôme loin de sa cause.
  # Livré : I98 (EntityReentrancyError). Partiel : I65 (console.error, ErrorReporter ⏳).
  # Cible : I8, I9 (metas, strate 1b).
  mode: run
  etat: partiel

- id: I75
  nature: C
  parents: [P9]
  enonce: Aucun `any` ni `unknown` dans les signatures publiques de `Channel`, `Feature` ou `View`.
  # Tests de type seulement ; aucune configuration ESLint dans le dépôt.
  mode: revue
  etat: partiel

- id: I76
  nature: C
  parents: [P9, P3]
  enonce: Les méthodes de `Channel` sont typées par `TDef` — un nom de message est une clé de la voie, jamais une `string` libre.
  mode: type
  etat: livre

- id: I103
  nature: D
  parents: [I76, I21]
  enonce: "Les clés de Commands, d'Events et de Requests d'un `TChannelDefinition` sont en `camelCase` plat, lettres uniquement."
  pourquoi: >
    Même règle que le namespace (I21), pour les mêmes raisons : une clé de message est réemployée
    dans le token `"ns:clé"` et dans le nom du handler découvert par convention
    (`onAddItemCommand`), où seul le `camelCase` plat donne un identifiant valide et lisible ; et
    elle appartient au vocabulaire du domaine — une action, un fait, une question —, fait de noms
    et de verbes où un chiffre n'a pas de sens métier.
  # Écart relevé le 30/09 : `CamelCase<S>` ne contraint que les clés du manifest ; une clé
  # `addItem2` ou `add_item` dans un Channel compile aujourd'hui sans erreur. Mécanisme visé :
  # appliquer `CamelCase<K>` aux clés de `TChannelDefinition`. La grammaire des noms
  # (verbNoun, nounVerbed, nominal) reste une convention de style, hors de cette ligne.
  mode: type
  etat: cible

- id: I77
  nature: C
  parents: [P9, P2]
  enonce: "`View.trigger()` n'accepte qu'une clé `\"ns:cmd\"` validée contre le contrat de la View."
  mode: type
  etat: livre

- id: I78
  nature: C
  parents: [P9, P6]
  enonce: "`View.getUI(key)` n'accepte qu'une clé déclarée dans le `TUIContract` de la View."
  mode: type
  etat: livre

- id: I79
  nature: C
  parents: [P9, P2]
  enonce: "`Feature.request()` n'accepte qu'un `TChannelToken` typé, jamais un namespace `string` libre."
  mode: type
  etat: livre

- id: I48
  nature: D
  parents: [P9]
  enonce: Les handlers sont des méthodes nommées par convention (`on<Name>Command`, `on<Name>Request`, `on<Channel><Event>Event`, handlers DOM), découvertes et câblées par le framework.
  pourquoi: >
    Pas de décorateurs ni d'enregistrement manuel : le nom de la méthode est la déclaration, ce qui
    permet au compilateur de dériver les handlers attendus d'un contrat (I88) (ADR-09).
  mode: boot
  etat: livre

- id: I88
  nature: D
  parents: [I48]
  enonce: Tout package qui expose un `T{Component}Contract` expose aussi le `T{Component}Callbacks` qui en dérive les handlers requis.
  pourquoi: >
    Symétrie contrat/callbacks : la déclaration d'un contrat devient un engagement vérifié par le
    compilateur (`implements`), pour View comme pour Feature (ADR-14, ADR-09).
  mode: revue
  etat: convention

- id: I92
  nature: D
  parents: [I88]
  enonce: Toute Feature concrète `implements TFeatureCallbacks<TDef, TListens>` ; un handler absent ou mal signé est une erreur de compilation.
  pourquoi: >
    `listens` ne porte que des tokens de Channel : aucun filet runtime ne peut détecter un handler
    d'Event manquant, la garantie est donc exclusivement compile-time, asymétrie assumée avec I82 (ADR-09).
  mode: type
  etat: livre

- id: I82
  nature: D
  parents: [I88]
  enonce: "`implements TViewCallbacks<TVC>` rend obligatoires les handlers d'Event et les handlers DOM déclarés ; un filet au `mount()` couvre les contournements."
  pourquoi: >
    La déclaration est l'engagement : un Event ou un événement DOM déclaré sans handler est refusé
    à la compilation, et au `mount()` pour le code JS ou casté (ADR-14).
  mode: type+boot
  etat: livre

- id: I84
  nature: C
  parents: [I82]
  enonce: Un élément UI déclaré avec `events` non vide exige ses handlers DOM ; `events` vide déclare un élément non interactif.
  mode: type+boot
  etat: livre

# I47 fusionné ici : même règle (token `static readonly channel` porté par la classe Feature).
- id: I73
  nature: D
  parents: [P9]
  alias: [I47]
  enonce: Chaque Feature déclare `static readonly channel` — son contrat de communication typé, unique pont entre la classe et son Channel.
  pourquoi: >
    Les consommateurs dépendent structurellement de `typeof XFeature` (`TFeatureContract`) : le token
    statique leur donne le contrat typé sans exposer l'instance de Channel (ADR-14).
  mode: type
  etat: livre

# I49 fusionné ici : même règle (co-localisation dans `*.feature.ts`).
- id: I74
  nature: D
  parents: [P9]
  alias: [I49]
  enonce: La définition du Channel, le type d'état et la classe Feature sont co-localisés dans le fichier `*.feature.ts` du domaine.
  pourquoi: >
    Organisation par domaine : Channel, state et Feature évoluent ensemble, un fichier `.channel.ts`
    séparé ne ferait que disperser un seul contrat (ADR-14).
  mode: revue
  etat: convention

- id: I93
  nature: D
  parents: [P9]
  enonce: "`listens` et `queries` sont des `abstract get` d'instance que toute Feature concrète implémente."
  pourquoi: >
    Des getters d'instance, lus après un constructeur inerte (I94), permettent de valider les
    références au bootstrap (I70) tout en étant imposés au compile-time (ADR-09).
  mode: type
  etat: livre

- id: I81
  nature: D
  parents: [P9]
  enonce: Les getters `features`, `uiEvents` et `uiElements` d'un consommateur sont évalués une seule fois, au `mount()`.
  pourquoi: >
    Une lecture unique fige les dépendances déclarées au moment du montage : un composant ne peut
    pas élargir ses canaux en cours d'exécution (ADR-14).
  mode: boot
  etat: livre

- id: I83
  nature: D
  parents: [P9]
  enonce: Tous les composants consommateurs composent leur contrat selon le même pattern modulaire (`TFeatureContract`, `TUIContract`, `TUIElements`).
  pourquoi: >
    Un pattern unique évite une règle différente par composant ; la cohérence du pattern est
    elle-même la garantie (ADR-14).
  mode: revue
  etat: convention

- id: I85
  nature: D
  parents: [P9]
  enonce: "`ui<TEl>()(events)` est le helper officiel pour construire une `TUIEntry`."
  pourquoi: >
    La forme curryfiée préserve l'inférence littérale de `events` et le sous-type d'élément `TEl`,
    que l'écriture directe perd (ADR-14).
  mode: revue
  etat: convention

- id: I86
  nature: D
  parents: [I85]
  enonce: Le champ `events` d'une `TUIEntry` est toujours présent, tableau (éventuellement vide) sans doublons.
  pourquoi: >
    Rendre le champ obligatoire force à déclarer explicitement un élément non interactif (`[]`)
    plutôt que de laisser l'absence ambiguë (ADR-14, ADR-15).
  mode: type
  etat: livre

- id: I89
  nature: D
  parents: [I85, P2]
  enonce: Tout événement déclaré dans `events` appartient à `TEventsFor<TEl>` ; les `CustomEvent` arbitraires sont exclus.
  pourquoi: >
    La communication entre composants passe par les Channels : autoriser des `CustomEvent` DOM
    ouvrirait un canal non déclaré (P2) (ADR-15).
  mode: type
  etat: partiel

- id: I90
  nature: C
  parents: [I85]
  enonce: Un nom d'événement apparaît au plus une fois dans `events`.
  mode: type
  etat: livre

- id: I91
  nature: D
  parents: [I85]
  enonce: "`TEventsFor<TEl>` est la table officielle entre sous-types d'éléments HTML et événements DOM cohérents."
  pourquoi: >
    Une table maintenue par le framework rend les événements autorisés dépendants du type d'élément,
    plutôt que d'accepter tout `HTMLElementEventMap` (ADR-15).
  mode: type
  etat: partiel
