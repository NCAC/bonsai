# Principes opérationnels — subordonnés à docs/theorie.md, source normative.
# Alignement V0.9.4 : 2026-10-30. IDs P1–P10 conservés ; ce ne sont pas les axiomes A0–A5.
# Chaque branche décline ces principes ; son alignement et sa livraison restent à vérifier.
# Les références ci-dessous indiquent le fondement théorique, sans modifier le schéma YAML.

- id: P1
  titre: Souveraineté du domaine
  # A1.b, A3.c, A4.a/A4.d ; §16.2, §16.3 et §16.5.
  enonce: L'état métier de référence est encapsulé dans l'Entity de sa Feature ; seule cette Feature y accède directement et le modifie. Les valeurs capturées, projections et brouillons de l'interface ne créent aucune autorité métier concurrente.
- id: P2
  titre: Dépendances déclarées
  # D16, §2.7.1, §2.7.3, §2.7.4 et §16.9.
  enonce: Les contrats connus avant le démarrage déclarent les Channels et messages accessibles, leurs modes, les faits admis, les résultats et bilans d'effets propres, leurs traitements locaux, les dépendances initiales et les protocoles de source. Aucune interaction ni aucun traitement applicatif implicite ne contourne ces déclarations.
- id: P3
  titre: Sémantique des trois voies
  # A3.e–A3.j, G1, G5, G7 et T2 ; le message local ne crée pas une quatrième voie intercomposants.
  enonce: Une Command demande une action sans réponse à un seul propriétaire, qui peut la refuser ; un Event émis par le propriétaire sur sa ressource est diffusé à ses abonnés ; une Query demande une connaissance synchrone en lecture seule transitive. Les trois modes sont exclusifs ; un message local reste interne à son auteur.
- id: P4
  titre: Causalité observable et segments bornés
  # A5, G8, D9, D19 et §2.7.4.
  enonce: L'infrastructure conserve les déclenchements observables et distingue continuation corrélée, indépendance établie et observation d'antécédent inconnu, sans parent inventé ni lien connu effacé. La borne causale porte sur les segments connus ; elle ne garantit ni terminaison ni absence de boucle à travers une coupure d'observation.
- id: P5
  titre: Interface de projection, domaine autonome
  # A4, D12, D18 et §16.4–§16.8 ; Behavior est une partie de View, pas un composant.
  enonce: L'interface utilisateur projette le domaine sans décider ni valider son état métier. Ses décisions restent de présentation ou de composition, et son état local ne crée aucune autorité métier. Une Command exige un déclencheur autorisé par D18 ; ni Event, ni relais ou résultat d'effet corrélé à un Event, ni observation d'antécédent inconnu ne l'autorise. Une Query préalable conserve la permission de son auteur sans l'accorder au traitement consulté ; Composer n'adresse aucune Command.
- id: P6
  titre: Propriété et parts de l'interface
  # A1, A2, A3.c/A3.d, D3, D11 et §16.4–§16.7.
  enonce: Chaque ressource du modèle a un propriétaire unique et immuable, seul à exécuter ses opérations exclusives. Dans l'interface, les attributions de parts disjointes soustraient les portions attribuées à l'accès du contenant ; leur restitution n'est pas un transfert. Cette propriété ne se confond pas avec celle du support DOM extérieur ; les effets sur ce support restent bornés par les ressources et désignations autorisées.
- id: P7
  titre: Cycle de vie hétéronome
  # A0.d, A1.a, A2, T3 et §2.5/§2.7.2.
  enonce: Chaque composant a une existence unique ; hors racine, son parent est propriétaire de cette existence et décide de sa création ou de sa destruction. La structure est finie et enracinée ; la fin du parent entraîne celle de ses descendants et de leurs ressources, avec restitutions de bas en haut. L'existence et la fin de la racine sont extérieures au modèle ; la vie logique ne se confond pas avec la matérialisation DOM.
- id: P8
  titre: Identités et déclarations par racine
  # D1, D9, D14–D16, G6 et §16.9.
  enonce: Chaque racine a son Manifest, immuable pendant sa vie ; elle attribue les identités déclarées aux Features et adaptateurs. Le namespace en est une représentation textuelle, non l'identité elle-même. Le Manifest et ses contrats assemblés fixent les enfants, adaptateurs et périmètres, l'élément Foundation, les dépendances initiales, les protocoles de source et la borne causale ; aucun message ne traverse les racines.
- id: P9
  titre: Garantie au plus tôt
  meta: true
  # O2, §19 et 18.7 ; frontière de confiance : §11.7, pas le bootstrap seul.
  enonce: Chaque obligation contrôlable reçoit une garde au niveau le plus précoce possible, à la compilation, au démarrage ou à l'exécution selon les données disponibles ; chaque obligation sémantique non vérifiable reçoit une justification explicite et une revue. La frontière de confiance comprend tous les points d'admission. Les tests de conformité de l'infrastructure ne remplacent ni les gardes applicatives ni une preuve générale.
- id: P10
  titre: Une responsabilité, un rôle
  meta: true
  # Règle de méthode ; §2.5 et §16. Les rôles ne sont pas tous des composants.
  enonce: Chaque rôle porte une seule fonction architecturale ; deux rôles ne portent pas la même. Entity et Behavior ne sont pas des composants ; leurs opérations sont imputées respectivement à leur Feature et à leur View. La répartition des rôles respecte les frontières de la théorie et n'ajoute aucune autorité absente de celle-ci.
