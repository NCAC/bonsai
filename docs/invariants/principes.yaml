# Principes du modèle Bonsai — source de vérité.
# Changer un principe = changer de modèle : modification rare, explicite, datée.
# Statut : pilote (seul P8 est migré ; les autres principes sont listés pour référence).

- id: P1
  titre: Souveraineté du domaine
  enonce: Le domain state n'existe que dans une Entity ; seule la Feature propriétaire y accède et le modifie.
- id: P2
  titre: Dépendances déclarées
  enonce: Un composant n'interagit qu'avec ce qu'il a déclaré statiquement ; il n'existe aucun canal implicite.
- id: P3
  titre: Sémantique des trois voies
  enonce: Une intention (Command) va à un seul propriétaire, qui peut la refuser ; un fait (Event) est publié par son seul propriétaire vers N abonnés ; une lecture (Request) est sans effet.
- id: P4
  titre: Causalité traçable et bornée
  enonce: Toute chaîne de messages est reconstituable jusqu'à l'action d'origine, et sa longueur est bornée.
- id: P5
  titre: La couche concrète projette, elle ne décide pas
  enonce: "Le rendu est une projection du domaine : les composants de la couche concrète (View, Behavior, Composer, Foundation) projettent l'état et relaient les intentions de l'utilisateur, sans porter d'état métier ni prendre de décision métier — accepter ou refuser une intention, calculer ou valider un état du domaine, enchaîner une réaction à un Event par un Command. Leurs seules décisions sont de présentation : quoi afficher et comment, où monter une View, quel état local de présentation tenir."
- id: P6
  titre: Propriété exclusive du DOM
  enonce: Chaque nœud du DOM a au plus un propriétaire, seul composant autorisé à le muter. La propriété découle de scopes attribués et disjoints, fixés au montage du composant et stables jusqu'à son démontage.
- id: P7
  titre: Cycle de vie hétéronome
  enonce: Aucun composant ne décide de sa propre existence ; création et destruction viennent d'un niveau supérieur.
- id: P8
  titre: Identité par le manifest
  enonce: Une Feature n'a d'identité que par sa clé dans un manifest unique.
- id: P9
  titre: Garantie au plus tôt
  meta: true
  enonce: Toute règle imposée au code applicatif est garantie par construction au compile-time ; à défaut, vérifiée au bootstrap, frontière de confiance. Seule une règle qui dépend de données connues à l'exécution est vérifiée au runtime, et alors par une garde qui échoue explicitement dès la première violation.
- id: P10
  titre: Une responsabilité, un rôle
  meta: true
  enonce: Chaque responsabilité du framework est portée par un seul rôle, et chaque rôle n'en porte qu'une ; aucun rôle n'empiète sur celle d'un autre.
